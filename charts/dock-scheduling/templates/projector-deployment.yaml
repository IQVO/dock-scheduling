{{- if .Values.analytics.enabled }}
{{- include "dock-scheduling.requireAnalyticsConfig" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dock-scheduling.projectorFullname" . }}
  labels:
    {{- include "dock-scheduling.labels" . | nindent 4 }}
    app.kubernetes.io/component: analytics-projector
spec:
  replicas: {{ .Values.analytics.projector.replicaCount }}
  selector:
    matchLabels:
      {{- include "dock-scheduling.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: analytics-projector
  template:
    metadata:
      labels:
        {{- include "dock-scheduling.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: analytics-projector
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dock-scheduling.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: projector
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "dock-scheduling.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/projector"]
          ports:
            - name: admin
              containerPort: 8091
              protocol: TCP
          # Env contract verified against cmd/projector/main.go:
          # ANALYTICS_DATABASE_URL, KAFKA_BROKERS, ANALYTICS_CONSUMER_GROUP,
          # ADMIN_ADDR, SHUTDOWN_DRAIN_DELAY and LOG_LEVEL. It never opens
          # the OLTP database (no DATABASE_URL here) and applies its embedded
          # analytical migrations itself, so ANALYTICS_DATABASE_URL must be a
          # DIRECT DSN. No telemetry env: the projector sets no metrics
          # endpoint up.
          env:
            - name: ADMIN_ADDR
              value: {{ .Values.analytics.projector.adminAddr | quote }}
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            # The FIXED consumer group (never a literal in the binary's
            # reader config): a stable id lets a rescheduled pod resume from
            # its committed offsets.
            - name: ANALYTICS_CONSUMER_GROUP
              value: {{ .Values.analytics.projector.consumerGroup | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- with .Values.config.shutdownDrainDelay }}
            - name: SHUTDOWN_DRAIN_DELAY
              value: {{ . | quote }}
            {{- end }}
            - name: ANALYTICS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "dock-scheduling.analyticsSecretName" . }}
                  key: ANALYTICS_DATABASE_URL
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            # /readyz flips to 503 as the first step of graceful shutdown, so
            # a draining pod stops being ready without failing liveness.
            httpGet:
              path: /readyz
              port: admin
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.analytics.projector.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
