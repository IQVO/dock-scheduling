{{- include "dock-scheduling.requireRealRuntime" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dock-scheduling.fullname" . }}
  labels:
    {{- include "dock-scheduling.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.api.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dock-scheduling.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dock-scheduling.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dock-scheduling.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "dock-scheduling.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # Every config.* value (OUTBOX_RELAY_INTERVAL, OUTBOX_BATCH_SIZE,
          # OUTBOX_MAX_ATTEMPTS, SHUTDOWN_DRAIN_DELAY, ...) reaches cmd/api
          # through the chart ConfigMap. The explicit `env` entries below win
          # over envFrom for the same key and carry the same values, so
          # nothing changes for the variables already set here; the
          # checksum/config annotation above rolls the pods when the ConfigMap
          # changes. Only this Deployment mounts it: the other binaries read
          # their own explicit env.
          envFrom:
            - configMapRef:
                name: {{ include "dock-scheduling.fullname" . }}
          # Env contract verified against cmd/api/main.go's header comment.
          # Values that have a dedicated chart key are rendered here, never
          # through extraEnv, so the same variable is never set twice.
          env:
            - name: HTTP_ADDR
              value: {{ .Values.config.httpAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- with .Values.config.outboxRelayInterval }}
            - name: OUTBOX_RELAY_INTERVAL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.outboxBatchSize }}
            - name: OUTBOX_BATCH_SIZE
              value: {{ . | quote }}
            {{- end }}
            # The relay (inline in cmd/api) excludes a row after this many
            # failures (0 = unlimited).
            - name: OUTBOX_MAX_ATTEMPTS
              value: {{ .Values.config.outboxMaxAttempts | quote }}
            {{- with .Values.config.shutdownDrainDelay }}
            - name: SHUTDOWN_DRAIN_DELAY
              value: {{ . | quote }}
            {{- end }}
            # The four local-copy/policy consumers (ADR 0003) always run on
            # real Kafka inside cmd/api, each under a STABLE group id from
            # values, never a literal: a stable id is what makes a
            # rescheduled pod resume from its committed offsets.
            - name: YARD_CONSUMER_GROUP
              value: {{ .Values.config.yardConsumerGroup | quote }}
            - name: FACILITY_CONSUMER_GROUP
              value: {{ .Values.config.facilityConsumerGroup | quote }}
            - name: ASN_CONSUMER_GROUP
              value: {{ .Values.config.asnConsumerGroup | quote }}
            - name: CPT_CONSUMER_GROUP
              value: {{ .Values.config.cptConsumerGroup | quote }}
            # The strangler stage A importer (ADR 0003): unset = off, so the
            # value is only rendered when set.
            {{- with .Values.config.dockLegacyImportConsumerGroup }}
            - name: DOCK_LEGACY_IMPORT_CONSUMER_GROUP
              value: {{ . | quote }}
            {{- end }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "dock-scheduling.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # A direct (non-pooled) connection used only for the
            # golang-migrate step, never for the runtime pgxpool.
            # `optional: true` so a secret without this key still starts the
            # pod -- the binary falls back to DATABASE_URL.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "dock-scheduling.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            # Mandatory (requireKafka): the inline relay, the consumers and
            # /readyz.
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            {{- range .Values.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
